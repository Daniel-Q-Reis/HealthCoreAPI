global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: django
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['ca-django-api.icyocean-8228f51c.centralus.azurecontainerapps.io']
        labels:
          service: healthcore-api
